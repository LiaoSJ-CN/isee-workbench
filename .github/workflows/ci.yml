name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt pyproject.toml
      - run: pip install ruff
      # Scan app + tests so CI matches `make lint` (which scans `.`).
      - run: ruff check .

  backend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt pyproject.toml
      - run: pip install -r requirements.txt
      - run: pip install mypy
      # Tests/ is excluded: fixtures use untyped pytest helpers and don't
      # need to satisfy the same bar as production code. Run `mypy tests/`
      # locally if you want to spot-check a specific module.
      - run: mypy app

  backend-test:
    # Run pytest on the lowest-supported Python (pyproject `>= 3.11`) and
    # the local dev version (`.venv` is 3.14) so we catch deprecation or
    # version-specific breakage early. New Python versions have been the
    # source of subtle regressions before (see P10 / PY-16).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements.txt pyproject.toml
      - run: pip install -r requirements.txt
      - run: pip install -e ".[dev]"
      - run: pytest -q --cov=app --cov-report=term --cov-fail-under=70

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint

  frontend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build

  frontend-test:
    # vitest unit tests (happy-dom + RTL). Runs on the lint node matrix
    # so it shares the npm ci cache; tests are ~1.6s on a warm cache.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test

  e2e:
    # Playwright smoke tests. Boots docker-compose (web + db, scheduler
    # disabled so only the web container runs the API), waits for the
    # backend health check, runs the suite against http://localhost:8080.
    # The web container proxies /api to the backend container.
    runs-on: ubuntu-latest
    services:
      backend:
        image: isee-workbench-backend
        build:
          context: .
          dockerfile: backend/Dockerfile
        env:
          DATABASE_URL: sqlite:////tmp/test.db
          SCHEDULER_DISABLED: "true"
          CORS_ORIGINS: '["http://localhost:8080"]'
        ports:
          - 8000:8000
        options: >-
          --health-cmd "python -c 'import urllib.request,sys; urllib.request.urlopen(\"http://localhost:8000/docs\").read(); sys.exit(0)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
      frontend:
        image: isee-workbench-frontend
        build:
          context: .
          dockerfile: frontend/Dockerfile
        ports:
          - 8080:80
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
