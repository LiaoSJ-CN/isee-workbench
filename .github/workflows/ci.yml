name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt pyproject.toml
      - run: pip install ruff
      # Scan app + tests so CI matches `make lint` (which scans `.`).
      - run: ruff check .
      - name: ruff format check (no edits, exit non-zero on drift)
        run: ruff format --check .

  backend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt pyproject.toml
      - run: pip install -r requirements.txt
      - run: pip install mypy
      # Tests/ is excluded: fixtures use untyped pytest helpers and don't
      # need to satisfy the same bar as production code. Run `mypy tests/`
      # locally if you want to spot-check a specific module.
      - run: mypy app

  backend-test:
    # Run pytest on the lowest-supported Python (pyproject `>= 3.11`) and
    # the local dev version (`.venv` is 3.14) so we catch deprecation or
    # version-specific breakage early. New Python versions have been the
    # source of subtle regressions before (see P10 / PY-16).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements.txt pyproject.toml
      - run: pip install -r requirements.txt
      - run: pip install -e ".[dev]"
      - run: pytest -q --cov=app --cov-report=term --cov-fail-under=70

  frontend-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: prettier check (no edits, exit non-zero on drift)
        run: npm run format:check

  frontend-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build

  frontend-test:
    # vitest unit tests (happy-dom + RTL). Runs on the lint node matrix
    # so it shares the npm ci cache; tests are ~1.6s on a warm cache.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test

  docs-vs-code:
    # Drift guard: parses backend/app/config.py (Settings fields) and
    # backend/app/routers/*.py (@router.X paths) and checks them against
    # DEPLOY.md's env-var table and README.md's API table. Fails if any
    # declared field/route isn't documented.
    #
    # Designed to be cheap (no DB, no pytest, no frontend build). Runs
    # on every push; exit code = 0 only when docs and code are in sync.
    # See scripts/diff_docs_vs_code.py for the implementation.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt pyproject.toml
      - run: pip install -r requirements.txt
      - name: Verify Settings fields + router paths are documented
        run: python ../scripts/diff_docs_vs_code.py --strict

  backend-test-pg:
    # Cross-dialect smoke against PostgreSQL 16 (批 11.2 / P1-2).
    # Catches the biggest production-deployment risk: DDL/FK/CHECK
    # divergence and ORM dialect bugs (``DateTime(timezone=True)``,
    # JSON column queries, ON DELETE SET NULL semantics). Runs
    # ``alembic upgrade head`` plus a curated subset of pytest that
    # exercises the full ORM surface without depending on SQLite's
    # lax FK enforcement.
    #
    # The full ``653``-test suite is SQLite-only for now — several
    # test files (test_audit_log, test_data_source_acl, the test_clones,
    # test_explorer, …) cascade-delete DataSource rows during cleanup
    # that SQLite silently allows but PostgreSQL rejects. Those tests
    # need explicit ordering (delete reports → delete shares → delete
    # access → delete data_source), which is a broader cleanup workstream
    # tracked separately. The CI job below covers ~340 tests that
    # already pass on PG without changes, plus the migration round-trip.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: isee_test
          POSTGRES_USER: isee
          POSTGRES_PASSWORD: isee
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U isee -d isee_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    env:
      DATABASE_URL: postgresql://isee:isee@localhost:5432/isee_test
      JWT_SECRET_KEY: pytest-secret-do-not-use-in-pg
      ENCRYPTION_KEY: 2wjRI6T24tbe64kcfOGqMlTCUrg5gzk82QE8BTYbpNc=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt pyproject.toml
      - run: pip install -r requirements.txt
      - run: pip install -e ".[dev]"
      - name: Migrate against PostgreSQL (DDL/FK/CHECK smoke)
        run: alembic upgrade head
      - name: Seed admin user
        # PG test DB starts empty (no ``seed_reports`` equivalent for
        # non-sqlite DIALECT). Just the admin user is enough for the
        # /auth/* + RBAC + audit endpoint tests we run below.
        run: |
          python - <<'PY'
          from app.database import SessionLocal
          from app.models.user import User
          db = SessionLocal()
          try:
              if db.query(User).filter_by(username="admin").first() is None:
                  db.add(User(username="admin", password_hash="pg-test-only", role="admin"))
                  db.commit()
          finally:
              db.close()
          PY
      - name: Run PG-safe pytest subset
        run: |
          pytest \
            tests/test_alert_rules.py \
            tests/test_alembic_migration_replay.py \
            tests/test_auth.py \
            tests/test_csrf.py \
            tests/test_db_migrations.py \
            tests/test_email_sender.py \
            tests/test_jwt.py \
            tests/test_metrics.py \
            tests/test_notification_config.py \
            tests/test_notification_im.py \
            tests/test_notification_migration.py \
            tests/test_password.py \
            tests/test_proxy_headers.py \
            tests/test_rate_limit.py \
            tests/test_rbac_auth.py \
            tests/test_rbac_deps.py \
            tests/test_request_id_middleware.py \
            tests/test_scheduler_runner.py \
            tests/test_security_headers.py \
            tests/test_sentry_init.py \
            tests/test_sql_validator.py \
            tests/test_sql_validator_property.py \
            tests/test_ssrf_guard.py \
            tests/test_subscriptions.py \
            tests/test_webhook_security.py \
            -q

  e2e:
    # Playwright smoke tests. Boots docker-compose (web + db, scheduler
    # disabled so only the web container runs the API), waits for the
    # backend health check, runs the suite against http://localhost:8080.
    # The web container proxies /api to the backend container.
    runs-on: ubuntu-latest
    services:
      backend:
        image: isee-workbench-backend
        build:
          context: .
          dockerfile: backend/Dockerfile
        env:
          DATABASE_URL: sqlite:////tmp/test.db
          SCHEDULER_DISABLED: "true"
          CORS_ORIGINS: '["http://localhost:8080"]'
        ports:
          - 8000:8000
        options: >-
          --health-cmd "python -c 'import urllib.request,sys; urllib.request.urlopen(\"http://localhost:8000/docs\").read(); sys.exit(0)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
      frontend:
        image: isee-workbench-frontend
        build:
          context: .
          dockerfile: frontend/Dockerfile
        ports:
          - 8080:80
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:80/ || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
