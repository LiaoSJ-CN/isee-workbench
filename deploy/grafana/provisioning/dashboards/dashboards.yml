# Auto-load any .json dashboard dropped into
# ``deploy/grafana/dashboards/`` (mounted as /var/lib/grafana/dashboards
# in the container). Picked up on every Grafana restart; updates the
# ``isee-workbench`` dashboard in place rather than creating a
# duplicate.
apiVersion: 1

providers:
  - name: isee-workbench
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
