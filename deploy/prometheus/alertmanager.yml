# Default alertmanager config for isee-workbench.
#
# This file ships with the stack so the alertmanager container starts
# out of the box — without a config, the image refuses to boot. It is
# deliberately a no-op stub: the only ``receiver`` is ``"null"``, which
# drops every alert silently. Operator workflows are expected to bind-
# mount their own config on top of this one once they've picked a
# notification channel (Slack webhook / email / PagerDuty / etc.).
#
# When you write your real config, mirror the route tree to the
# severity ladder used in deploy/prometheus/alerts/isee-workbench.yml:
#
#   route:
#     receiver: ops-default
#     routes:
#       - matchers: [severity="critical"]
#         receiver: pager-critical
#       - matchers: [severity="warning"]
#         receiver: slack-warnings
#
# That keeps the rules file readable while letting you route by severity
# without touching Prometheus.
global:
  resolve_timeout: 5m

route:
  receiver: "null"
  group_by: [alertname, service]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: "null"