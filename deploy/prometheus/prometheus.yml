# Prometheus scrape config for the isee-workbench stack.
#
# Mounted at /etc/prometheus/prometheus.yml in the prometheus
# container via docker-compose. The ``backend:8000`` target uses the
# docker-compose service name ``backend`` so it resolves on the
# ``isee-net`` network regardless of the container IP.
#
# Scrape interval is 15s — matches Grafana's ``timeInterval`` in
# datasources/prometheus.yml so panels never show "no data" right
# after a refresh.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: isee-workbench

# Alerting rules. Mounted via docker-compose at
# /etc/prometheus/alerts/*.yml — drop more files alongside
# isee-workbench.yml without touching this config. The alertmanager
# target below is commented out by default; enable it once you bring up
# an alertmanager service (see docker-compose ``observability`` profile).
#
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#             - alertmanager:9093

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: isee-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8000
        labels:
          service: isee-backend
          tier: api

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
