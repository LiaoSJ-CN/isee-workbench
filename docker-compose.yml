services:
  backend:
    build: ./backend
    container_name: isee-backend
    restart: unless-stopped
    # P5 (SEC-13): backend port is NOT exposed to the host in production.
    # The frontend nginx proxies to backend:8000 via the internal Docker
    # network (isee-net).  Uncomment for local dev without nginx:
    # ports:
    #   - "127.0.0.1:8000:8000"
    environment:
      - APP_NAME=${APP_NAME:-iSee Data Analysis Workbench}
      - DEBUG=${DEBUG:-false}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./app.db}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:8080","http://127.0.0.1:8080"]}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - LOGIN_RATE_LIMIT=${LOGIN_RATE_LIMIT:-10}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-10}
      - SCHEDULER_DISABLED=${SCHEDULER_DISABLED:-true}
      - SCHEDULER_RESYNC_INTERVAL=${SCHEDULER_RESYNC_INTERVAL:-30}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - isee-data:/app
    networks:
      - isee-net

  frontend:
    build: ./frontend
    container_name: isee-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend
    networks:
      - isee-net

  # Sidecar process for scheduled report generation.
  # Only needed if SCHEDULER_DISABLED=true (the default) and you have
  # reports with active schedules.
  scheduler:
    build: ./backend
    container_name: isee-scheduler
    restart: unless-stopped
    command: python -m app.scheduler_runner
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./app.db}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-10}
      - SCHEDULER_RESYNC_INTERVAL=${SCHEDULER_RESYNC_INTERVAL:-30}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - isee-data:/app
    networks:
      - isee-net
    profiles:
      - scheduler

  # Optional: Use PostgreSQL for the metadata database instead of SQLite.
  # Uncomment and set DATABASE_URL=postgresql://isee:changeme@db:5432/isee
  # db:
  #   image: postgres:16-alpine
  #   container_name: isee-db
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: isee
  #     POSTGRES_PASSWORD: changeme
  #     POSTGRES_DB: isee
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   networks:
  #     - isee-net
  #   profiles:
  #     - postgres

  # Optional: Prometheus + Grafana for /metrics dashboards.
  # Brings up Prometheus (scraping backend:8000/metrics) and a Grafana
  # instance with the ``isee-workbench`` dashboard pre-loaded via the
  # provisioning files under deploy/grafana/. Operator login is
  # ``admin`` / ``admin`` by default — change GF_SECURITY_ADMIN_PASSWORD
  # (or the compose env override) for any non-local use.
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: isee-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    depends_on:
      - backend
    networks:
      - isee-net
    profiles:
      - observability

  # Optional alertmanager — receives alerts from prometheus once you
  # uncomment the ``alerting.alertmanagers`` block in
  # deploy/prometheus/prometheus.yml. Default route is a no-op
  # webhook config; override alertmanager.yml via your own bind-mount
  # (drop a config into deploy/prometheus/alertmanager.yml and add the
  # mount here). Out of the box it logs alerts to stdout only.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: isee-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./deploy/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    networks:
      - isee-net
    profiles:
      - observability

  grafana:
    image: grafana/grafana:11.3.0
    container_name: isee-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/isee-workbench-dashboard.json:/var/lib/grafana/dashboards/isee-workbench.json:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    networks:
      - isee-net
    profiles:
      - observability

volumes:
  isee-data:

  # Uncomment if using PostgreSQL
  # pgdata:
  prometheus-data:
  grafana-data:
  alertmanager-data:

networks:
  isee-net:
    driver: bridge
